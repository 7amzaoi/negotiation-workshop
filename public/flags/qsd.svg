<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- SDF/Qسد Flag - Yellow background -->
  <rect width="160" height="120" fill="#FFD700"/>

  <!-- Simplified Syria map outline -->
  <g transform="translate(40, 12) scale(0.7)">
    <path d="M30,5 L60,2 L85,5 L105,10 L115,5 L118,15 L112,25 L108,45 L110,65 L108,85 L100,95 L85,105 L75,115 L50,120 L35,115 L25,105 L15,95 L5,80 L8,65 L15,50 L10,35 L15,20 L25,10 Z"
          fill="white" stroke="#2E7D32" stroke-width="3"/>
    <!-- Euphrates river -->
    <path d="M85,8 L80,25 L75,45 L72,55 L68,70 L60,85 L55,100 L48,115"
          fill="none" stroke="#1565C0" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Red star -->
  <g transform="translate(80, 90)">
    <polygon points="0,-10 2.9,-3.1 10,-3.1 4.5,1.7 6.9,8.1 0,4.5 -6.9,8.1 -4.5,1.7 -10,-3.1 -2.9,-3.1"
             fill="#D32F2F" stroke="#B71C1C" stroke-width="0.5"/>
  </g>
</svg>